#############################
######## AfvalWijzer ########
#############################

homeassistant:
  customize:
    sensor.afvalwijzer_today:
      friendly_name: Vandaag
    sensor.afvalwijzer_tomorrow:
      friendly_name: Morgen
    sensor.afvalwijzer_day_after_tomorrow:
      friendly_name: Overmorgen
    sensor.afvalwijzer_next_type:
      friendly_name: Volgende type afval
    sensor.afvalwijzer_next_date:
      friendly_name: Eerstvolgende ophaalmoment
    sensor.afvalwijzer_next_in_days:
      friendly_name: Aantal dagen voor ophaalmoment
    input_boolean.waste_reminder:
      icon: mdi:reminder

    sensor.afvalwijzer_gft:
      friendly_name: GFT
      entity_picture: /local/images/afvalwijzer/gft.png
    sensor.afvalwijzer_oud_papier_en_karton:
      friendly_name: Papier
      entity_picture: /local/images/afvalwijzer/papier.png
    sensor.afvalwijzer_pmd:
      friendly_name: PMD
      entity_picture: /local/images/afvalwijzer/pmd.png

################################################
## Template sensors
################################################
template:
  - sensor:
      - name: Afvalwijzer GFT formatted
        unique_id: afvalwijzer_gft_formatted
        state: >-
          {% set ts = states('sensor.afvalwijzer_gft') | as_timestamp(default=none) %}
          {{ ts | timestamp_custom('%d-%m-%Y') if ts is not none else 'Geen' }}

      - name: Afvalwijzer Papier formatted
        unique_id: afvalwijzer_papier_formatted
        state: >-
          {% set ts = states('sensor.afvalwijzer_papier') | as_timestamp(default=none) %}
          {{ ts | timestamp_custom('%d-%m-%Y') if ts is not none else 'Geen' }}

      - name: Afvalwijzer PMD formatted
        unique_id: afvalwijzer_pmd_formatted
        state: >-
          {% set ts = states('sensor.afvalwijzer_pmd') | as_timestamp(default=none) %}
          {{ ts | timestamp_custom('%d-%m-%Y') if ts is not none else 'Geen' }}

      - name: Afvalwijzer Restafval formatted
        unique_id: afvalwijzer_restafval_formatted
        state: >-
          {% set ts = states('sensor.afvalwijzer_restafval') | as_timestamp(default=none) %}
          {{ ts | timestamp_custom('%d-%m-%Y') if ts is not none else 'Geen' }}

      - name: Afvalwijzer next item formatted
        unique_id: afvalwijzer_next_item_formatted
        state: >-
          {{ {
            'gft': 'GFT',
            'papier': 'Papier',
            'pmd': 'PMD',
            'restafval': 'Restafval'
          }.get(states('sensor.afvalwijzer_next_item'), 'Geen') }}

      - name: Afvalwijzer today formatted
        unique_id: afvalwijzer_today_formatted
        state: >-
          {{ {
            'gft': 'GFT',
            'papier': 'Papier',
            'pmd': 'PMD',
            'restafval': 'Restafval'
          }.get(states('sensor.afvalwijzer_today'), 'Geen') }}

      - name: Afvalwijzer tomorrow formatted
        unique_id: afvalwijzer_tomorrow_formatted
        state: >-
          {{ {
            'gft': 'GFT',
            'papier': 'Papier',
            'pmd': 'PMD',
            'restafval': 'Restafval'
          }.get(states('sensor.afvalwijzer_tomorrow'), 'Geen') }}

      - name: Afvalwijzer day after tomorrow formatted
        unique_id: afvalwijzer_day_after_tomorrow_formatted
        state: >-
          {{ {
            'gft': 'GFT',
            'papier': 'Papier',
            'pmd': 'PMD',
            'restafval': 'Restafval'
          }.get(states('sensor.afvalwijzer_day_after_tomorrow'), 'Geen') }}


############################
######## Automation ########
############################

automation:
  - alias: "PKG_Afvalwijzer: AbN - Mark waste as moved"
    id: 004a2fe1-bcf7-4d59-9cd1-ce07f2f6f84c
    description: >-
      AbN = Action by Notification = Een actie van een eerdere notification triggert
      deze automation.


      Op het moment dat het afval aan de weg is gezet de originele notificatie
      beantwoord worden met true.
    mode: single
    triggers:
      - event_type: mobile_app_notification_action
        event_data:
          action: MARK_WASTE_MOVED
        trigger: event
    actions:
      - entity_id: input_boolean.waste_moved
        action: input_boolean.turn_on
      - data:
          message: YES!! Het afval is aan de weg gezet!! DANKJEWEL!!
          title: "Afval: Dank u"
        action: notify.family

  - alias: "PKG_Afval: Notification - Waste has not been moved"
    id: 50abc2ca-9956-4822-81ef-0f8455167232
    triggers:
      - hours: /1
        trigger: time_pattern
    conditions:
      - condition: and
        conditions:
          - condition: state
            entity_id: input_boolean.waste_moved
            state: "off"
          - condition: state
            entity_id: input_boolean.waste_reminder
            state: "on"
          - condition: time
            after: "18:00:00"
            before: "23:00:00"
          - condition: template
            value_template: "{{ states('sensor.afvalwijzer_tomorrow') != 'geen' }}"
    actions:
      - data:
          title: Afval
          message: >-
            Het is vandaag - {{ now().strftime("%d-%m-%Y") }}. Afvaltype(n): {{
            states.sensor.afvalwijzer_tomorrow.state }} wordt opgehaald op: {{
            (as_timestamp(now()) + (24*3600)) | timestamp_custom("%d-%m-%Y", True)
            }}!
          data:
            actions:
              - action: MARK_WASTE_MOVED
                title: Container staat aan de weg!
            push:
              badge: 0
              category: afval
        action: notify.family

  - alias: "PKG_Afvalwijzer: Reset waste notification"
    id: 0bcc81e4-9491-4da0-a2b4-0a133e9740fd
    triggers:
      - entity_id: input_boolean.waste_moved
        to: "on"
        for:
          hours: 12
        trigger: state
    actions:
      - entity_id: input_boolean.waste_moved
        action: input_boolean.turn_off
      - entity_id: input_boolean.waste_reminder
        action: input_boolean.turn_on
