views:
  - title: Dashboard
    path: dashboard
    icon: mdi:home-outline
    badges: []
    cards:
      - type: grid
        columns: 1
        square: false
        cards:
          - type: weather-forecast
            entity: weather.home
            name: Amersfoort
            secondary_info_attribute: pressure
            show_forecast: true
          - type: custom:simple-thermostat
            entity: climate.toon
            show_header: true
            decimals: '1'
            control:
              preset:
                away:
                  icon: mdi:logout
                  name: null
                comfort:
                  icon: mdi:sofa
                  name: null
                home:
                  icon: mdi:home
                  name: null
                sleep:
                  icon: mdi:sleep
                  name: null
            sensors:
              - entity: switch.holiday_mode
                name: Holiday Mode
            style: |
              ha-card .mode-item {
                background: var(--paper-card-background-color);
              }  
            name: 'Thermostaat:'
            icon: mdi:fire
          - type: vertical-stack
            cards:
              - type: glance
                entities:
                  - entity: sensor.afvalwijzer_gft
                    name: GFT
                    image: /local/mijnafvalwijzer/gft3.png
                  - entity: sensor.afvalwijzer_papier
                    name: Papier
                    image: /local/mijnafvalwijzer/papier3.png
                  - entity: sensor.afvalwijzer_pmd
                    name: Plastic
                    image: /local/mijnafvalwijzer/plastic3.png
                show_state: true
                state_color: false
              - type: entities
                show_header_toggle: false
                entities:
                  - entity: sensor.afvalwijzer_next_item
                    name: Volgende container
                  - entity: sensor.afvalwijzer_next_date
                    name: Datum volgende container
                  - entity: input_boolean.waste_moved
                  - entity: input_boolean.waste_reminder
              - type: horizontal-stack
                cards:
                  - type: picture-entity
                    entity: sensor.afvalwijzer_today
                    name: Vandaag
                    state_image:
                      gft: /local/mijnafvalwijzer/gft3.png
                      papier: /local/mijnafvalwijzer/papier3.png
                      restafval: /local/mijnafvalwijzer/rest3.png
                      pmd: /local/mijnafvalwijzer/plastic3.png
                      kerstbomen: /local/mijnafvalwijzer/kliko3.png
                      Geen: /local/mijnafvalwijzer/kliko3.png
                  - type: picture-entity
                    entity: sensor.afvalwijzer_tomorrow
                    name: Morgen
                    state_image:
                      gft: /local/mijnafvalwijzer/gft3.png
                      papier: /local/mijnafvalwijzer/papier3.png
                      restafval: /local/mijnafvalwijzer/rest3.png
                      pmd: /local/mijnafvalwijzer/plastic3.png
                      kerstbomen: /local/mijnafvalwijzer/kliko3.png
                      Geen: /local/mijnafvalwijzer/kliko3.png
                  - type: picture-entity
                    entity: sensor.afvalwijzer_day_after_tomorrow
                    name: Overmorgen
                    state_image:
                      gft: /local/mijnafvalwijzer/gft3.png
                      papier: /local/mijnafvalwijzer/papier3.png
                      restafval: /local/mijnafvalwijzer/rest3.png
                      pmd: /local/mijnafvalwijzer/plastic3.png
                      kerstbomen: /local/mijnafvalwijzer/kliko3.png
                      Geen: /local/mijnafvalwijzer/kliko3.png
              - type: custom:auto-entities
                card:
                  type: glance
                filter:
                  include:
                    - entity_id: sensor.afvalwijzer_gft
                    - entity_id: sensor.afvalwijzer_papier
                    - entity_id: sensor.afvalwijzer_pmd
                    - entity_id: sensor.afvalwijzer_restafval
                sort:
                  attribute: days_until_collection_date
                  method: attribute
                  numeric: true
  - title: Multimedia
    path: multimedia
    icon: mdi:television-classic
    badges: []
    cards:
      - type: vertical-stack
        cards:
          - type: grid
            columns: 4
            square: false
            cards:
              - type: button
                tap_action:
                  action: toggle
                entity: switch.tv
                name: TV
                icon: mdi:television
                show_state: false
                show_name: true
                hold_action:
                  action: more-info
                icon_height: 75px
              - type: button
                tap_action:
                  action: toggle
                entity: switch.radio
                icon: mdi:radio
                show_name: true
                name: Radio
                icon_height: 75px
              - type: button
                tap_action:
                  action: toggle
                entity: switch.xboxone
                name: XBOX
                show_name: true
                icon: mdi:microsoft-xbox
                icon_height: 75px
              - type: button
                tap_action:
                  action: toggle
                entity: switch.nintendowiiu
                name: Wii-U
                icon: mdi:nintendo-wiiu
                show_name: true
                icon_height: 75px
              - type: button
                tap_action:
                  action: toggle
                entity: switch.pc
                icon_height: 75px
                show_name: true
                name: PC/Switch
                icon: mdi:laptop
              - type: button
                tap_action:
                  action: toggle
                entity: switch.nes
                name: NES
                icon: mdi:gamepad-square-outline
                show_name: true
                icon_height: 75px
              - type: button
                tap_action:
                  action: toggle
                entity: switch.snes
                name: SNES
                icon: mdi:gamepad-variant-outline
                show_name: true
                icon_height: 75px
              - type: button
                tap_action:
                  action: toggle
                entity: switch.googlechromecast
                show_name: true
                name: Chromecast
                icon: mdi:cast
                icon_height: 75px
          - type: conditional
            conditions:
              - entity: sensor.harmony_hub_status
