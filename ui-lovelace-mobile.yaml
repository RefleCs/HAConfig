                  size: 73%
                - type: custom:button-card
                  entity: script.net5
                  show_entity_picture: true
                  entity_picture: /local/images/zenderlogos/net5.png
                  name: NET 5
                  show_name: false
                  aspect_ratio: 1/1
                  tap_action:
                    action: toggle
                  haptic: success
                  size: 72%
                - type: custom:button-card
                  entity: script.veronicadisneyxd
