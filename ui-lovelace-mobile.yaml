                    action: toggle
                  haptic: success
                  size: 90%
              columns: 3
              square: true
          - type: conditional
            conditions:
              - entity: sensor.harmony_hub_status
                state: Radio KPN
            card:
              type: grid
              cards:
                - type: custom:button-card
                  entity: light.slaapkamer_main
                  show_entity_picture: true
                  entity_picture: /local/images/zenderlogos/radio538.png
                  name: Radio 538
