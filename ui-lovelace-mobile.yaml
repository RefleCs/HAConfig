  - title: Graphs
    path: graphs
    icon: mdi:graph
    badges: []
    cards:
      - type: sensor
        entity: sensor.overloop_sensor_light_level
        graph: line
        detail: 2
        hours_to_show: 24
        name: 'Overloop: Lichtintensiteit (1 week)'
      - type: sensor
        entity: sensor.overloop_sensor_temperature
        graph: line
        name: 'Overloop: Temperatuur (1 week)'
  - theme: Backend-selected
    icon: mdi:ev-plug-ccs2
    title: Tesla
    path: tesla
    badges: []
    cards:
      - type: gauge
        entity: sensor.the_whisperer_charging_rate_sensor
        unit: km/u
        name: Laadsnelheid
        needle: false
      - type: gauge
        entity: sensor.the_whisperer_battery_sensor
        name: State of Charge
        max: 100
        min: 0
        severity:
          green: 20
          yellow: 80
          red: 5
      - show_name: true
        show_icon: true
        show_state: true
        type: glance
        entities:
          - entity: sensor.the_whisperer_temperature_sensor_inside
            name: Binnen
          - entity: sensor.the_whisperer_temperature_sensor_outside
            name: Buiten
        title: Temperaturen
        columns: 2
        state_color: false
  - theme: Backend-selected
    title: Lights
    path: lights
    icon: mdi:ceiling-light-multiple-outline
    badges: []
    cards: []
  - theme: Backend-selected
    title: Ouders
    visible:
      - user: 57d06e57961846bdb10270b49f97a021
      - user: 04eac4449f444f259be0fa8f7544c2e0
    badges: []
    cards:
      - type: entities
        entities:
          - entity: input_boolean.taak_2
          - entity: input_boolean.taak_6
          - entity: input_boolean.taak_3
          - entity: input_boolean.taak_1
          - entity: input_boolean.taak_5
          - entity: input_datetime.tasks_helper
        title: Dagelijkse taken
        show_header_toggle: false
        state_color: true
      - type: entities
        entities: []
        title: Weekelijkse Taken
      - type: entities
        entities:
          - entity: input_boolean.taak_4
          - entity: input_boolean.taak_7
        title: Maandelijkse Taken
        show_header_toggle: false
      - type: grid
        cards:
          - show_name: true
            show_icon: true
            type: button
            tap_action:
              action: toggle
            entity: script.add_one_point
            name: +1 punt
          - show_name: true
            show_icon: true
            type: button
            tap_action:
              action: toggle
            entity: script.remove_one_point
            name: '-1 punt'
          - show_name: true
            show_icon: true
            type: button
            tap_action:
              action: toggle
            entity: script.reset_points
            name: Reset punten
          - type: markdown
            content: Verdien zoveel mogelijk punten!
            title: 'Goal:'
          - type: gauge
            entity: counter.tasks_taken_teller
            max: 10
          - type: gauge
            entity: counter.tasks_counter_andra
          - type: gauge
            entity: counter.tasks_counter_elisa
  - theme: Backend-selected
    title: Andra
    path: andra
    icon: ''
