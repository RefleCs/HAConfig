title: iPad Dashboard
views:
#
#    #############################################################################################################################################
#    #                                                                                                                                           #
#    #                                                              Floorplan View                                                               #
#    #                                                                                                                                           #
#    #############################################################################################################################################
#
  - title: Control Rooms
    icon: 'mdi:floor-plan'
    panel: true
    badges: []
    cards:
#
#        ###################   config-template-card    #####################
#        #########################   IMPORTANT!    #########################
#
#        # To use the styling templates for individual lights, I have used
#        # Config Template Card. Config template card passes the entities it
#        # uses into the card. Make sure you change these entities below to
#        # your own and include any light entities you use above.
#
#        # To understand why, check: https://github.com/iantrich/config-template-card
#
      - type: 'custom:config-template-card'
        entities:
          - light.hue_argenta_color_spot_1
          - light.hue_argenta_color_spot_2
          - light.hue_argenta_color_spot_3
          - light.hue_argenta_color_spot_4
          - light.hue_filament_left
          - light.hue_filament_right
          - light.hue_fugato_color_spot_1
          - light.hue_fugato_color_spot_2
          - light.hue_fugato_color_spot_3
          - light.hue_fugato_color_spot_4
          - light.hue_white_lamp_1
          - light.hue_filament_bulb_1
          - light.livingcolors
          - light.corner_table
          - light.on_off_light_1_2
          - light.light
          - light.on_off_light_1
        card:
#          ###################   Picture Elements Card    #####################
          type: picture-elements
          image: /local/ui/floorplan/floorplan_night.png
          style: |
            ha-card:first-child {
              background: rgba(42, 46, 48, 1)
            }
          elements:
#
#              #########################    DAY BASE FLOORPLAN OVERLAY    #########################
#
            - action: none
              entity: sun.sun
              hold_action:
                action: none
              state_image:
                above_horizon: /local/ui/floorplan/floorplan_day.png
                below_horizon: /local/transparent.png
              style:
                height: 100%
                left: 50%
                mix-blend-mode: lighten
                opacity: '${ states[''sensor.sunlight_opacity''].state }'
                top: 50%
                width: 100%
              tap_action:
                action: none
              type: image
#
#
#              #########################    WEATHER ANIMATIONS    #########################
#
            - action: none
              entity: weather.buienweather
              hold_action:
                action: none
              image: /local/ui/floorplan/weather/rainstorm.gif
              state_filter:
                'pouring': opacity(100%)
              style:
                left: 60%
                mix-blend-mode: color-dodge
                top: 50%
                width: 110%
                opacity: 0
              tap_action:
                action: none
              type: image
#
#
#              #########################    Inside overlays for weather    #########################
#
#
            - action: none
              hold_action:
                action: none
              image: /local/ui/floorplan/main_night.png
              style:
                height: 100%
                left: 50%
                top: 50%
                width: 100%
              tap_action:
                action: none
              type: image
#
            - action: none
              entity: sun.sun
              hold_action:
                action: none
              state_image:
                above_horizon: /local/ui/floorplan/main_day.png
                below_horizon: /local/transparent.png
              style:
                height: 100%
                left: 50%
                mix-blend-mode: lighten
                opacity: '${ states[''sensor.sunlight_opacity''].state }'
                top: 50%
                width: 100%
              tap_action:
                action: none
              type: image
#
#              #########################    INDIVIDUAL LIGHTS - BLENDED IMAGE OVERLAYS    #########################
#
            - action: none
              entity: light.hue_filament_left
              hold_action:
                action: none
              image: /local/ui/floorplan/lights/table.png
              style:
                filter: >-
                  ${ "hue-rotate(" + (states['light.hue_filament_left'].attributes.hs_color
                  ? states['light.hue_filament_left'].attributes.hs_color[0] : 0) + "deg)"}
                left: 73.73%
                mix-blend-mode: lighten
                opacity: "${states['light.hue_filament_left'].state === 'on' ? (states['light.hue_filament_left'].attributes.brightness / 255) : '0'}"
                top: 32.65%
                width: 39.296875%
